# PCB-YOLO v2 Configuration File
# Based on YOLO11 + DAGE Geometric Prior + Polarization Fusion for PCB Defect Detection

# ==================== Dataset Configuration ====================
data:
  dataset_path: "./data/PCBDefectDataset"
  val_iou_threshold: 0.45
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  img_size: 640
  num_classes: 6
  class_names:
    - open
    - short
    - mousebite
    - spur
    - copper
    - pin-hole

# ==================== Model Configuration ====================
model:
  name: "yolo11n"
  use_dage: true
  learnable_gabor: true
  use_p2_head: true
  use_wiou: true
  use_polarization: false
  pretrained: true
  conf_threshold: 0.50
  iou_threshold: 0.40
  max_det: 300
  fluctuation:
    enabled: false
    num_passes: 10
    consistency_threshold: 0.7
    fluctuation_threshold: 0.05

# ==================== Training Configuration ====================
train:
  epochs: 50
  batch_size: 16
  workers: 4
  device: "cpu"
  optimizer: "AdamW"
  lr0: 0.001
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  cos_lr: true
  patience: 50
  save_period: 10
  project: "./results/train"
  name: "pcb_yolo11_dage"
  seed: 42

# ==================== Inference Configuration ====================
inference:
  model_path: "./models/best.pt"
  source: 0
  img_size: 640
  conf_threshold: 0.50
  iou_threshold: 0.40
  save_results: true
  show_preview: true
  device: "cpu"

# ==================== Hardware Configuration ====================
hardware:
  camera:
    index: 0
    width: 1920
    height: 1080
    exposure: -1
    fps: 30
  conveyor:
    enabled: false
    motor_pin: 5
    speed: 100
  sensor:
    enabled: false
    trigger_pin: 2
    debounce_ms: 50
  servo:
    enabled: false
    pin: 9
    angle_ok: 45
    angle_ng: 135
    delay_ms: 500

# ==================== Serial Communication ====================
serial:
  port: "COM3"
  baudrate: 115200
  timeout: 1.0

# ==================== GUI Configuration ====================
gui:
  window_title: "PCB-YOLO Defect Detection & Sorting System"
  window_width: 1400
  window_height: 900
  refresh_interval: 33
  show_fps: true
  show_confidence: true
  expert_mode: true
  default_mode: "production"

# ==================== Production Configuration ====================
production:
  profiles_dir: "./configs/line_profiles"
  default_profile: "default"
  sn_barcode_enabled: true
  sn_prefix: "PCB"
  operator_required: true
  equipment_id: "EQ-001"

# ==================== Traceability Configuration ====================
traceability:
  db_path: "./results/traceability.db"
  max_history: 100000

# ==================== Suppression Rules Configuration ====================
suppression:
  rules_dir: "./configs/suppression_rules"
  enabled: false
# ==================== Alarm Configuration ====================
alarm:
  sound_enabled: true
  light_enabled: true
  beep_freq: 1000
  beep_duration: 300
  cooldown_ms: 2000

# ==================== Equipment Monitor Configuration ====================
monitor:
  brightness_min: 40
  brightness_max: 220
  fps_min: 10
  inference_max_ms: 200

# ==================== Authentication Configuration ====================
auth:
  enabled: false
  db_path: "./configs/users.json"
  audit_log: "./results/audit.log"

# ==================== System Configuration ====================
system:
  log_level: "INFO"
  log_file: "./results/system.log"
  save_images: true
  save_dir: "./results/detections"
  max_history: 1000

